name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest -q
      - run: python -m py_compile server.py launcher.py
      - run: bash -n start start.sh stop.sh start.command
      - run: node --check static/app.js && node --check static/api.js && node --check static/ui-model.js && node --check static/i18n.js && node --check static/appearance.js
      - run: node --test tests/*.test.mjs
